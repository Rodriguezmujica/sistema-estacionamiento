<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Autenticación Firebase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .test-container { max-width: 600px; margin: 50px auto; }
        .status-indicator { 
            display: inline-block; 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            margin-right: 5px; 
        }
        .status-connected { background-color: #28a745; }
        .status-disconnected { background-color: #dc3545; }
        .status-loading { background-color: #ffc107; }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="card">
            <div class="card-header">
                <h3>🔥 Prueba de Autenticación Firebase</h3>
            </div>
            <div class="card-body">
                <!-- Estado de conexión -->
                <div class="mb-4">
                    <h5>Estado de Conexión</h5>
                    <div id="connection-status">
                        <span class="status-indicator status-loading"></span>
                        <span>Inicializando...</span>
                    </div>
                </div>

                <!-- Información del usuario -->
                <div class="mb-4" id="user-info" style="display: none;">
                    <h5>Usuario Actual</h5>
                    <div id="user-details"></div>
                </div>

                <!-- Formulario de login -->
                <div id="login-form">
                    <h5>Iniciar Sesión</h5>
                    <form onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Email</label>
                            <input type="email" class="form-control" id="usuario" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                    </form>
                </div>

                <!-- Mensajes de error -->
                <div id="error-message"></div>

                <!-- Botón de cerrar sesión -->
                <div id="signout-section" style="display: none;">
                    <button class="btn btn-danger" onclick="handleSignOut()">Cerrar Sesión</button>
                </div>

                <!-- Información de configuración -->
                <div class="mt-4">
                    <h5>Configuración</h5>
                    <div class="alert alert-info">
                        <strong>Nota:</strong> Asegúrate de haber configurado correctamente los archivos:
                        <ul class="mb-0 mt-2">
                            <li><code>firebase-config.js</code></li>
                            <li><code>firebase-config.php</code></li>
                        </ul>
                    </div>
                </div>

                <!-- Log de eventos -->
                <div class="mt-4">
                    <h5>Log de Eventos</h5>
                    <div id="event-log" style="background: #f8f9fa; padding: 10px; border-radius: 5px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js';

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "TU_API_KEY_AQUI",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto-id",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Función para log
        function log(message) {
            const logDiv = document.getElementById('event-log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Función para actualizar estado de conexión
        function updateConnectionStatus(connected) {
            const statusDiv = document.getElementById('connection-status');
            const indicator = statusDiv.querySelector('.status-indicator');
            const text = statusDiv.querySelector('span:last-child');
            
            if (connected) {
                indicator.className = 'status-indicator status-connected';
                text.textContent = 'Conectado a Firebase';
            } else {
                indicator.className = 'status-indicator status-disconnected';
                text.textContent = 'Desconectado de Firebase';
            }
        }

        // Función para actualizar información del usuario
        function updateUserInfo(user) {
            const userInfoDiv = document.getElementById('user-info');
            const userDetailsDiv = document.getElementById('user-details');
            const signoutSection = document.getElementById('signout-section');
            const loginForm = document.getElementById('login-form');

            if (user) {
                userInfoDiv.style.display = 'block';
                signoutSection.style.display = 'block';
                loginForm.style.display = 'none';
                
                userDetailsDiv.innerHTML = `
                    <div class="alert alert-success">
                        <strong>UID:</strong> ${user.uid}<br>
                        <strong>Email:</strong> ${user.email}<br>
                        <strong>Email Verificado:</strong> ${user.emailVerified ? 'Sí' : 'No'}
                    </div>
                `;
            } else {
                userInfoDiv.style.display = 'none';
                signoutSection.style.display = 'none';
                loginForm.style.display = 'block';
            }
        }

        // Escuchar cambios en el estado de autenticación
        onAuthStateChanged(auth, (user) => {
            if (user) {
                log('Usuario autenticado: ' + user.email);
                updateUserInfo(user);
                updateConnectionStatus(true);
            } else {
                log('Usuario no autenticado');
                updateUserInfo(null);
                updateConnectionStatus(true);
            }
        });

        // Función para manejar login
        window.handleLogin = async function(event) {
            event.preventDefault();
            
            const email = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            
            log('Intentando iniciar sesión con: ' + email);
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                log('Login exitoso');
            } catch (error) {
                log('Error en login: ' + error.message);
                document.getElementById('error-message').innerHTML = `
                    <div class="alert alert-danger mt-3">
                        Error: ${error.message}
                    </div>
                `;
            }
        };

        // Función para manejar logout
        window.handleSignOut = async function() {
            try {
                await signOut(auth);
                log('Sesión cerrada');
            } catch (error) {
                log('Error al cerrar sesión: ' + error.message);
            }
        };

        // Log inicial
        log('Aplicación inicializada');
        log('Configuración de Firebase cargada');
    </script>
</body>
</html>
